[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matflowkit"
version = "0.3.0"
description = "MatFlowKit: computational materials workflow toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9",
    "numpy>=1.21",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dpdata = ["dpdata>=0.2.18"]
structure = ["ase>=3.23", "pymatgen>=2024.5"]
dev = ["pytest>=7"]
dpa4 = ["ase>=3.23", "deepmd-kit>=3.1", "dftd3>=1.1"]
all = [
    "matplotlib>=3.5",
    "dpdata>=0.2.18",
    "ase>=3.23",
    "pymatgen>=2024.5",
    "deepmd-kit>=3.1",
    "dftd3>=1.1",
]

[project.scripts]
mfk = "matflowkit.cli:app"

[tool.setuptools.packages.find]
include = ["matflowkit*"]

[tool.pytest.ini_options]
markers = [
    "integration: requires external real calculation samples",
]
