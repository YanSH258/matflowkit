[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tcct"
dynamic = ["version"]
description = "TCCT: Theoretical & Computational Chemistry Tools"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "YanSH258"},
]
keywords = ["theoretical-chemistry", "computational-chemistry", "atomistic-simulation", "workflow", "deepmd", "abacus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "typer>=0.9",
    "numpy>=1.21",
    "cp2kdata>=0.7.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dpdata = ["dpdata>=0.2.18"]
cp2k = ["dpdata>=0.2.18"]
structure = ["ase>=3.23", "pymatgen>=2024.5"]
dev = ["pytest>=7"]
dpa4 = ["ase>=3.23", "deepmd-kit>=3.1", "dftd3>=1.1"]
all = [
    "matplotlib>=3.5",
    "dpdata>=0.2.18",
    "ase>=3.23",
    "pymatgen>=2024.5",
    "deepmd-kit>=3.1",
    "dftd3>=1.1",
]

[project.scripts]
tcct = "tcct.cli:app"

[project.urls]
Homepage = "https://github.com/YanSH258/tcct"
Repository = "https://github.com/YanSH258/tcct.git"
Issues = "https://github.com/YanSH258/tcct/issues"

[tool.setuptools.packages.find]
include = ["tcct*"]

[tool.setuptools.dynamic]
version = {attr = "tcct.__version__"}

[tool.pytest.ini_options]
markers = [
    "integration: requires external real calculation samples",
]
